name: coffecrop

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defínelo en backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defínelo en backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defínelo en backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - conocimiento_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conocimiento_datos:
